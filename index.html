<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Osaka Kyoto Food Map</title>
  <meta name="description" content="오사카/교토 맛집 메모를 모바일 지도 앱으로 정리한 개인용 가이드">
  <link rel="stylesheet" href="./styles.css?v=705648b">
</head>
<body>
  <div class="app-shell">
    <div id="map" aria-label="오사카 교토 맛집 지도"></div>

    <header class="floating-panel top-panel">
      <div class="hero-copy">
        <p class="eyebrow">Mobile-first food guide</p>
        <h1>오사카 · 교토 맛집맵</h1>
        <p class="subtitle">지도를 화면 전체로 두고, 필요한 정보만 플로팅 패널로 띄우는 방식으로 정리했어.</p>
      </div>
      <div class="action-row">
        <button id="locateBtn" class="primary-btn" type="button">내 위치로 거리 보기</button>
      </div>
      <section class="controls compact-controls" aria-label="지도 필터">
        <label>
          <span>도시</span>
          <select id="cityFilter">
            <option value="all">전체</option>
            <option value="Osaka">오사카</option>
            <option value="Kyoto">교토</option>
          </select>
        </label>
        <label>
          <span>음식</span>
          <select id="cuisineFilter">
            <option value="all">전체</option>
          </select>
        </label>
        <label class="search-wrap wide-field">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="가게명, 지역, 음식 검색">
        </label>
      </section>
    </header>

    <aside class="floating-panel map-legend">
      <p>핀 색상: <b>정확 위치</b> · <b>대략 위치</b> · <b>폐업/불명</b></p>
      <p>기준점: <b>난바역</b> · <b>오사카역</b> · <b>텐노지역</b> · <b>교토역</b> · <b>기온</b></p>
    </aside>

    <section class="floating-panel list-panel" aria-label="장소 목록">
      <div class="list-header">
        <div>
          <p class="eyebrow list-eyebrow">Map list</p>
          <h2>장소 목록</h2>
          <p id="resultMeta"></p>
        </div>
      </div>
      <div id="placeList" class="place-list"></div>
    </section>

    <section id="detailSheet" class="floating-panel detail-sheet hidden" aria-live="polite">
      <button id="closeSheet" class="sheet-close" type="button">닫기</button>
      <div id="detailContent"></div>
    </section>
  </div>

  <template id="cardTemplate">
    <article class="place-card">
      <div class="card-top">
        <div>
          <p class="card-area"></p>
          <h3 class="card-title"></h3>
        </div>
        <span class="card-rank"></span>
      </div>
      <p class="card-food"></p>
      <p class="card-note"></p>
      <div class="card-meta"></div>
    </article>
  </template>

  <script src="./app.js?v=705648b" defer></script>
</body>
</html>
